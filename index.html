<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the map can run under the notch/home indicator -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0D1320" />
    <style>
      /*
        Painted before the stylesheet arrives.

        The app's ground lives in `index.css`, which is a separate request — so
        between first paint and that file landing, the browser paints its own
        default. On a dark app that is a white flash on every cold start, and on
        a phone on bad signal it is not a flash, it is a second of white. This
        one declaration is the whole fix; `--surface-sunk` is the real source and
        `verify:contrast` fails if the two drift apart.
      */
      html {
        background: #0d1320;
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Allstar — field sales, built for the phone." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS ignores the manifest for the home-screen icon and will not composite
         transparency, so this one is the full-bleed teal variant. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Allstar Field</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
