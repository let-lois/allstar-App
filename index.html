<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the map can run under the notch/home indicator -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0D1320" />
    <style>
      /*
        Painted before the stylesheet arrives.

        The app's ground lives in `index.css`, which is a separate request — so
        between first paint and that file landing, the browser paints its own
        default. On a dark app that is a white flash on every cold start, and on
        a phone on bad signal it is not a flash, it is a second of white. This
        one declaration is the whole fix; `--surface-sunk` is the real source and
        `verify:contrast` fails if the two drift apart.
      */
      html {
        background: #0d1320;
      }
      /*
        The same fix for the other theme. Two grounds now, and the pre-paint one
        has to be whichever theme is about to apply — pinned to the dark value it
        is a dark flash on every cold start *of the light theme*, which is the
        exact bug this block exists to prevent, only harder to notice.
      */
      html[data-theme='light'] {
        background: #f0f2f7;
      }
    </style>
    <script>
      /*
        Theme, resolved before the first pixel.

        This has to run here, synchronously, ahead of the stylesheet and the
        bundle: the app's own theme module cannot help because by the time any
        module executes the browser has already painted. Reading a preference
        asynchronously and applying it afterwards is what produces the white
        flash people associate with dark-mode web apps.

        Deliberately duplicated from `src/lib/theme.ts` rather than imported,
        for the same reason the day boundary is duplicated between the phone and
        the Worker: a build step that welds them together is a build step that
        can fail on one side. `verify:theme` asserts the two agree.

        Every line is guarded. A throw in here happens before anything is
        rendered, so it would show a blank page rather than an error.
      */
      (function () {
        try {
          var raw = null
          try {
            raw = localStorage.getItem('allstar.theme')
          } catch (e) {}
          var choice = raw === 'light' || raw === 'dark' ? raw : 'system'
          var applied = choice
          if (choice === 'system') {
            applied = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          }
          document.documentElement.setAttribute('data-theme', applied)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', applied === 'light' ? '#F0F2F7' : '#0D1320')
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Allstar — field sales, built for the phone." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS ignores the manifest for the home-screen icon and will not composite
         transparency, so this one is the full-bleed teal variant. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Allstar Field</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
