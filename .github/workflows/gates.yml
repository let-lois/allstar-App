name: gates

# Every push and every pull request. The suite takes about twenty-five minutes
# run end to end, which is long enough that skipping it "just this once" is
# tempting — and trivial-looking changes are exactly where the last two silent
# bugs lived. So it is not a decision anybody has to make.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push supersedes an older one on the same branch. Two runs of the same
# branch tell you nothing the later one doesn't.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Types and a build, first, because everything below is pointless if the
  # thing doesn't compile — and because the browser gates all run against one
  # build rather than each making their own.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: typecheck (app)
        run: npm run typecheck
      - name: install api dependencies
        working-directory: api
        run: npm ci
      - name: typecheck (worker)
        working-directory: api
        run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # Arithmetic, colour maths and class-name checks. No browser, no server, so
  # these do not wait on the build and come back in about a minute.
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/ci/run.mjs --pure

  # Twenty-five browser gates, dealt into four piles. Serially this is most of
  # the twenty-five minutes; in parallel it is the length of the slowest pile.
  #
  # The gates are discovered from package.json rather than listed here, so a new
  # one is picked up by existing. `fail-fast: false` because one broken shard
  # should not hide what the other three would have said.
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Playwright resolves its own Chromium here. `scripts/lib/browser.mjs`
      # returns undefined when the dev container's copy is absent, which is what
      # lets the same gate run in both places.
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: serve the build
        run: |
          nohup npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173 && exit 0
            sleep 1
          done
          echo "preview server never came up"
          cat /tmp/preview.log
          exit 1
      - name: run shard ${{ matrix.shard }}
        run: node scripts/ci/run.mjs --browser --shard ${{ matrix.shard }} --of 4

  # Eight widths from a 320px Android up to a desktop, checking nothing overflows
  # and every tap target is reachable. Its own job because it is one command and
  # a failure here means something specific.
  viewports:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: serve the build
        run: |
          nohup npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173 && exit 0
            sleep 1
          done
          echo "preview server never came up"
          cat /tmp/preview.log
          exit 1
      - run: npm run audit:viewports

  # The Worker against a real D1, with GoHighLevel as a local mock.
  #
  # `wrangler dev --local` runs the Worker in Miniflare on the runner and needs
  # no Cloudflare account, so this covers the credential handling, the role
  # guards and the database constraints without a token existing anywhere. The
  # API smokes that do need a real Cloudflare account are not here and cannot be.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: install api dependencies
        working-directory: api
        run: npm ci
      - name: integrations smoke
        working-directory: api
        run: npm run smoke:integrations
