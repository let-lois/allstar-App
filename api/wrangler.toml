name = "allstar-api"
main = "src/index.ts"
# Pinned to the latest date the pinned wrangler's runtime supports. A date in
# the future silently falls back, which hides which semantics you're actually
# getting — better to state the real one and bump it deliberately with wrangler.
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Primary region is Eastern North America: reps write constantly from US
# cellular, and D1 writes go to the primary while reads are served from the
# edge. Set at creation — it cannot be changed later.
[[d1_databases]]
binding = "DB"
database_name = "allstar-db"
database_id = "3adac120-500e-404d-8a37-571ce3654bc0"

# Photos are the one thing too big for a database row — but R2 requires a
# payment method to activate, so the Worker still treats this binding as
# optional: without it every other endpoint works normally, uploads are refused
# with `no_photo_storage`, and photos stay cached on the phone. That path is not
# dead code — it is what every deployment without this bucket does, and it is
# gated (`cd api && npm run smoke:photos`).
#
# The bucket must exist in the account being deployed to, under exactly this
# name, or `wrangler deploy` fails. It failing is the good outcome: the
# alternative is a Worker that accepts photos and drops them.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "allstar-photos"

# Where the nightly database backup lands. A separate bucket from PHOTOS on
# purpose: a dump holds every customer's addresses, contact names, phone numbers
# and password hashes, and it does not belong in the bucket a rep's phone uploads
# to over an ordinary API call. Different contents, different blast radius.
#
# Optional in the same way PHOTOS is — the Worker refuses to take a backup rather
# than failing, and says so in the log and in /api/health. But the bucket must
# exist in the account before `wrangler deploy` will accept this file at all, so
# create it first:
#
#   npx wrangler r2 bucket create allstar-backups
#
# Everything in it is encrypted with BACKUP_KEY, which is a Worker secret and is
# not in this file. Losing that key makes every backup in this bucket permanently
# unreadable — see api/scripts/lib/backup-crypto.mjs.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "allstar-backups"

# ---------------------------------------------------------------------------
# Scheduled work.
#
# The only thing in this Worker that runs without somebody asking for it. It
# empties `integration_outbox` into each customer's CRM — a rep's sync queues
# the work and returns, so something has to push it, and doing that inside
# whatever request happens to be passing makes a rep on a doorstep wait on a
# third party.
#
# Five minutes rather than one: a lead reaching the office CRM within five
# minutes of a knock is well inside what anyone notices, and a fifth of the
# invocations is a fifth of the cost. The drain is capped per run and picks up
# where it left off, so a backlog clears over several ticks instead of one long
# one that could time out part-way.
# ---------------------------------------------------------------------------
# The second expression is the nightly database backup, at 07:17 UTC — a little
# after 3am on the east coast, when nobody is knocking. Not a multiple of five,
# so it never lands on the same minute as the drain; `scheduled()` branches on
# which expression fired, and both literals live in src/backup.ts.
#
# It needs the BACKUPS bucket above and a BACKUP_KEY secret. Without either it
# refuses and logs why — it will not write an unencrypted dump.
[triggers]
crons = ["*/5 * * * *", "17 7 * * *"]

[vars]
# Comma-separated. The console and the field app are the same origin today, but
# local development is a second one.
ALLOWED_ORIGINS = "https://allstar.letlois.com,https://allstar-app.pages.dev,http://localhost:5173,http://127.0.0.1:4173"

# Secrets, never committed. Set them with `wrangler secret put NAME`, or in the
# dashboard under Settings -> Variables and Secrets.
#
# They must be added as *Secrets*, not as Text variables. The [vars] block above
# is authoritative: `wrangler deploy` replaces the Worker's plain-text variables
# with exactly what is listed there, so a Text variable added in the dashboard
# disappears at the next deploy — and since a merge to main is meant to deploy
# (check `curl <api>/api/health | jq .version` — it reports the running commit,
# because that deploy has silently not happened before), that is
# soon and silent. Secrets are stored separately and survive.
#
#   SESSION_PEPPER        — mixed into password hashing. Never change it once
#                           accounts exist; it would invalidate every password.
#   BACKUP_KEY            — encrypts the nightly database backup. Use the SAME
#                           value as api/.backup-key on the machine that runs
#                           `npm run backup`, so one key opens both sets of
#                           files. Never rotate it: every backup already written
#                           with the old key becomes permanently unreadable, and
#                           nothing in this project can recover them. Without it
#                           the nightly backup refuses to run — deliberately, so
#                           that nobody ends up with an unencrypted dump of every
#                           customer's addresses and password hashes sitting in
#                           a bucket.
#   MAILCHANNELS_API_KEY  — emails invitations. Without it (or MAIL_FROM) the
#                           console hands the admin a link to send by hand,
#                           exactly as before; /api/health reports `mail`.
#                           MailChannels' Workers tier has been a paid plan
#                           since mid-2024. The sending domain needs their
#                           Domain Lockdown TXT record and an SPF include
#                           (DKIM recommended) before mail is accepted — the
#                           provider's own docs name the current values.
#   MAIL_FROM             — "Allstar <no-reply@yourdomain.com>". The domain
#                           must be the one carrying the DNS records above.
#   MAPTILER_API_KEY      — NO LONGER USED. MapTiler was the third link in the
#                           geocoding chain and has been removed. The Worker
#                           needs no MapTiler key; if one is still set as a
#                           secret it does nothing, and deleting it is safe.
#
#                           Why it went: the free plan allows one active key, and
#                           it was the *same* key as the front-end's
#                           VITE_MAPTILER_KEY. The browser needs that key
#                           origin-locked; a Worker sends no `Origin` header and
#                           so needs it origin-free. `?` was in the allowed-origins
#                           list to make one key serve both, which also let anyone
#                           who read it out of the bundle use it from `curl`.
#                           With geocoding gone the key is browser-only and can be
#                           locked to the app's origin, and `?` comes out.
#
#                           Tiles are still MapTiler — that is VITE_MAPTILER_KEY
#                           in the front-end build, not a Worker variable.
#   GOOGLE_MAPS_API_KEY   — optional, and tried FIRST when set. The only
#                           provider here that returns a rooftop rather than a
#                           point on a block.
#
#                           Two things to know before setting it. Google's terms
#                           expect Google-derived content on a Google map, so
#                           this belongs first only once the basemap is Google.
#                           And those terms permit only temporary caching of
#                           coordinates, while this app stores them permanently
#                           so the map draws offline. Both are covered in the
#                           README's pre-launch section; the second is a licence
#                           question for counsel, not a code change.
#
# With neither key, addresses geocode via the free US Census service, which
# places a house on the right block rather than on its roof. Everything works
# either way — /api/health reports which providers are configured.
