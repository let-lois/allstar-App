name = "allstar-api"
main = "src/index.ts"
# Pinned to the latest date the pinned wrangler's runtime supports. A date in
# the future silently falls back, which hides which semantics you're actually
# getting — better to state the real one and bump it deliberately with wrangler.
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Primary region is Eastern North America: reps write constantly from US
# cellular, and D1 writes go to the primary while reads are served from the
# edge. Set at creation — it cannot be changed later.
[[d1_databases]]
binding = "DB"
database_name = "allstar-db"
database_id = "3adac120-500e-404d-8a37-571ce3654bc0"

# Photos are the one thing too big for a database row — but R2 requires a
# payment method to activate, which a prototype shouldn't need. The Worker
# treats this binding as optional: without it every other endpoint works
# normally and photos stay cached on the phone, exactly as they do today.
#
# To enable uploads later: create the `allstar-photos` bucket, uncomment this,
# and redeploy. No code change.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "allstar-photos"

[vars]
# Comma-separated. The console and the field app are the same origin today, but
# local development is a second one.
ALLOWED_ORIGINS = "https://allstar.letlois.com,https://allstar-app.pages.dev,http://localhost:5173,http://127.0.0.1:4173"

# Secrets, never committed. Set them with `wrangler secret put NAME`, or in the
# dashboard under Settings -> Variables and Secrets.
#
# They must be added as *Secrets*, not as Text variables. The [vars] block above
# is authoritative: `wrangler deploy` replaces the Worker's plain-text variables
# with exactly what is listed there, so a Text variable added in the dashboard
# disappears at the next deploy — and since every merge to main deploys, that is
# soon and silent. Secrets are stored separately and survive.
#
#   SESSION_PEPPER        — mixed into password hashing. Never change it once
#                           accounts exist; it would invalidate every password.
#   MAPTILER_API_KEY      — optional. First choice for geocoding.
#
#                           Currently the *same* key as the front-end's
#                           VITE_MAPTILER_KEY, which is not the intended shape:
#                           the free plan allows one active key, and the browser
#                           needs it origin-locked while a Worker needs it
#                           origin-free. The key's allowed-origins list carries
#                           `?` to permit header-less requests, which is what
#                           makes one key serve both.
#
#                           That is a knowing compromise for the prototype, not
#                           a design. See "Before this goes to a paying
#                           customer" in the root README for what it costs and
#                           the two ways to close it.
#   GOOGLE_MAPS_API_KEY   — optional, and tried FIRST when set. The only
#                           provider here that returns a rooftop rather than a
#                           point on a block.
#
#                           Two things to know before setting it. Google's terms
#                           expect Google-derived content on a Google map, so
#                           this belongs first only once the basemap is Google.
#                           And those terms permit only temporary caching of
#                           coordinates, while this app stores them permanently
#                           so the map draws offline. Both are covered in the
#                           README's pre-launch section; the second is a licence
#                           question for counsel, not a code change.
#
# With neither key, addresses geocode via the free US Census service, which
# places a house on the right block rather than on its roof. Everything works
# either way — /api/health reports which providers are configured.
